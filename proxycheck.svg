  <circle cx="64" cy="64" r="13" fill="#12161c" stroke="#4a9eea" stroke-width="7"/>
  <circle cx="102" cy="64" r="9" fill="#4a9eea"/>
  <!-- health check mark -->
  <path d="M86 92 l10 10 l18 -22" fill="none" stroke="#19c37d" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
